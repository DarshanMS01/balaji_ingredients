<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Balaji Ingredients</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0d2410 0%, #17381b 50%, #1a4620 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
  }
  .brand-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-logo .icon { font-size: 2.4rem; }
  .brand-logo h1 {
    font-size: 1.4rem;
    font-weight: 800;
    color: #17381b;
    margin: 8px 0 4px;
  }
  .brand-logo p { font-size: 0.85rem; color: #6b7c72; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.88rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: #17381b;
    box-shadow: 0 0 0 3px rgba(23,56,27,0.1);
  }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #17381b, #2d5a31);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
    margin-top: 8px;
  }
  .btn-login:hover { opacity: 0.92; }
  .error-box {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .back-link {
    text-align: center;
    margin-top: 24px;
  }
  .back-link a {
    color: #17381b;
    font-size: 0.88rem;
    text-decoration: none;
    font-weight: 600;
  }
  .back-link a:hover { text-decoration: underline; }
  .divider { border: none; border-top: 1px solid #e8ede9; margin: 24px 0; }
  .security-note {
    text-align: center;
    font-size: 0.78rem;
    color: #9ca3af;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand-logo">
    <div class="icon">🌿</div>
    <h1>Balaji Ingredients</h1>
    <p>Admin Dashboard — Secure Access</p>
  </div>

  {% if error %}
  <div class="error-box">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST" action="">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="form-group">
      <label for="username">Administrator Username</label>
      <input type="text" id="username" name="username" required autofocus placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Enter password">
    </div>
    <button type="submit" class="btn-login">🔐 Sign In to Dashboard</button>
  </form>

  <hr class="divider">
  <div class="back-link">
    <a href="/">← Return to Balaji Ingredients Website</a>
  </div>
  <p class="security-note">This portal is restricted to authorised Balaji Ingredients staff only.<br>Unauthorised access attempts are logged.</p>
</div>
</body>
</html>
